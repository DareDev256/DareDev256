<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-labelledby="mk">
<title id="mk">James Dare, AI Solutions Engineer, Toronto</title>
<style>
  /* Defaults are ground-agnostic: legible on #ffffff and on #0d1117 with no media query at all. */
  .glyph { stroke: #818CF8; }
  .name  { fill: #818CF8; }
  .rule  { stroke: #6C63FF; }
  .role  { fill: #818CF8; }

  @media (prefers-color-scheme: light) {
    .glyph { stroke: #6C63FF; }
    .name  { fill: #1B1633; }
    .role  { fill: #6C63FF; }
  }
  @media (prefers-color-scheme: dark) {
    .glyph { stroke: #A78BFA; }
    .name  { fill: #F3F0FF; }
    .rule  { stroke: #818CF8; }
    .role  { fill: #A78BFA; }
  }

  .glyph { fill: none; stroke-width: 16; stroke-linecap: butt; stroke-linejoin: miter; }

  /* The resting state IS the default. Strip every animation and the mark is already correct. */
  #mark  { stroke-dasharray: 410; stroke-dashoffset: 0; animation: cut 1256ms cubic-bezier(.22,.61,.36,1) both; }
  #nameg { animation: rise 628ms cubic-bezier(.22,.61,.36,1) 942ms both; }
  #ruleg { animation: wipe 628ms cubic-bezier(.22,.61,.36,1) 1099ms both; }
  #roleg { animation: fade 628ms linear 1256ms both; }

  @keyframes cut  { from { stroke-dashoffset: 410; } to { stroke-dashoffset: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  #nameg { transform-origin: 190px 98px; }
  #ruleg { transform-origin: 190px 118px; }

  @media (prefers-reduced-motion: reduce) {
    #mark, #nameg, #ruleg, #roleg { animation: none; }
  }

  .name { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
          font-weight: 800; font-size: 64px; letter-spacing: 1.5px; }
  .role { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
          font-weight: 700; font-size: 24px; letter-spacing: 2.4px; }
</style>

<!-- JD cut as ONE path on an 8px unit grid. Every vertex lands on it, and so do both stroke
     edges (16 = two units, centred on x=72, so the stem's edges are x=64 and x=80).
     Ink field 16 units wide, x=8 to x=136. Bowl 8 units wide by 13 tall, the Fibonacci pair.
     One 4-unit radius serves the two bowl corners and the hook.
     The stroke is drawn hook first, then UP the shared vertical, then around the bowl and back
     into it: the J's stem and the D's spine are the same run of ink, so there is one counter
     and no background between them. Only the hook continues below the baseline. -->
<g transform="translate(25.7,40.7) scale(0.872)">
  <path id="mark" class="glyph" d="M 8 104 A 32 32 0 0 0 72 104 V 0 H 104 A 32 32 0 0 1 136 32 V 72 A 32 32 0 0 1 104 104 H 72"/>
</g>

<g id="nameg"><text class="name" x="190" y="98">JAMES DARE</text></g>
<g id="ruleg"><line class="rule" x1="190" y1="118" x2="262" y2="118" stroke-width="5"/></g>
<g id="roleg"><text class="role" x="190" y="152">AI SOLUTIONS ENGINEER &#183; TORONTO</text></g>
</svg>
